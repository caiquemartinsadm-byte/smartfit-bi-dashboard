eceita')+kpi('Margem EBITDA (RI)',fmt(margin(d,'ebitda_ri'),2)+'%','EBITDA contábil · IFRS 16')+kpi('Margem líquida (CVM)',fmt(d.margem_liquida_pct,2)+'%',ch(d.margem_variacao_pp,pp(d.margem_variacao_pp)+' a/a'),true);c=panel('Da receita ao lucro','DRE consolidada CVM · R$ milhões · '+d.periodo,waterfall(d),true)+split(panel('Evolução das margens','CVM e RI · margens sobre receita da respectiva fonte',chart(rows,[{name:'Bruta',color:gold,get:r=>margin(r,'bruto_cvm')},{name:'Operacional',color:white,get:r=>margin(r,'operacional_cvm')},{name:'EBITDA',color:green,get:r=>margin(r,'ebitda_ri')}],{suffix:'%',dec:1})),panel('Faturamento e receita líquida','RI · R$ milhões',chart(rows,[series('Faturamento','faturamento_ri',white),series('Receita líquida','receita_ri',gold)],{w:420,h:240})));ins=`A cascata utiliza a DRE consolidada CVM (${money(d.lucro_cvm)} de lucro líquido). A série RI permanece separada para EBITDA e faturamento. Investigar custos, resultado financeiro e efeitos tributários antes de atribuir mudanças de margem à expansão.`;heads=['Trimestre','Receita CVM (mi)','Lucro bruto (mi)','Operacional (mi)','EBITDA (mi)','Lucro RI (mi)','Lucro CVM (mi)','Margem bruta','Margem oper.','Margem EBITDA'];values=r=>[r.periodo,fmt(r.receita_cvm,2),fmt(r.bruto_cvm,2),fmt(r.operacional_cvm,2),fmt(r.ebitda_ri,2),fmt(r.lucro_ri,2),fmt(r.lucro_mil_brl/1000,2),fmt(margin(r,'bruto_cvm'),2)+'%',fmt(margin(r,'operacional_cvm'),2)+'%',fmt(margin(r,'ebitda_ri'),2)+'%'];source='Fonte: DRE consolidada CVM (cascata, margens bruta, operacional e líquida); Planilha Dinâmica Smart Fit (EBITDA, faturamento e receita RI). EBITDA contábil não é fluxo de caixa. A cascata mantém todos os componentes da DRE, inclusive equivalência patrimonial.';}$('#kpis').innerHTML=k;$('#content').innerHTML=c;$('#insight').innerHTML='<b>Leitura executiva · '+d.periodo+'</b><span>'+ins+'</span>';$('#table').innerHTML=table(rows,heads,values);$('#source').innerHTML=source+'<br>Base de 1T22 a 3T26 · Exibição de 1
